<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ถวายพระพรออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { bg: '#f9e89c', line: '#b8860b', btn: '#f2dd88', text: '#46370d' }
                    },
                    fontFamily: { sans: ['"Chakra Petch"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { 
            background: #f9e89c;
            font-family: '"Chakra Petch"', sans-serif; 
            color: #46370d; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
        }
        .page-container { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 1.5rem; }
        .image-section { display: flex; flex-direction: column; align-items: center; }
        .royal-img { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; border-radius: 8px; object-fit: contain; }
        .top-text { font-size: 1.15rem; font-weight: 600; line-height: 1.7; margin-top: 0.75rem; text-align: center; }
        .form-area { display: flex; flex-direction: column; align-items: center; gap: 1.75rem; width: 100%; }
        .input-group { width: 100%; display: flex; align-items: center; gap: 0.75rem; }
        .input-group label { font-size: 1.35rem; font-weight: 500; white-space: nowrap; color: #46370d; }
        .input-group input { flex: 1; background: transparent; border: none; border-bottom: 2px solid #b8860b; outline: none; font-size: 1.35rem; font-family: inherit; color: #46370d; padding: 0.25rem 0.5rem; }
        .submit-btn {
            background: linear-gradient(180deg, #f9eb9f 0%, #e6c864 50%, #d4af37 100%);
            border: 2px solid #b8860b;
            border-radius: 999px;
            padding: 0.9rem 2.25rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: #46370d;
            font-family: inherit;
            cursor: pointer;
            clip-path: polygon(0 50%, 8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%);
        }
        .submit-btn:hover { transform: translateY(-1px); }
        #statusMsg { min-height: 1.5rem; font-size: 1.15rem; font-weight: 600; text-align: center; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="image-section">
            <img src="Wachira.jpg" alt="พระบรมฉายาลักษณ์" class="royal-img" loading="lazy">
            <p class="top-text">น้อมเกล้าถวายพระพรชัยมงคล<br>
            สมเด็จพระเจ้าอยู่หัวมหาวชิราลงกรณ บดินทรเทพยวรางกูร<br>
            มหิศรภูมิพลราชวรางกูร กิติสิริสมบูรณอดุลยเดช<br>
            สยามินทราธิเบศรราชวโรดม บรมนาถบพิตร<br>พระวชิรเกล้าเจ้าอยู่หัว</p>
        </div>

        <div class="form-area">
            <div class="input-group">
                <label>ชื่อ – นามสกุล</label>
                <input type="text" id="fullName" placeholder="">
            </div>

            <button id="submitBtn" class="submit-btn">
                <i class="fa fa-file-text-o mr-2"></i> ลงนามถวายพระพร
            </button>

            <div id="statusMsg"></div>
        </div>
    </div>

    <script>
        // 👇 เปลี่ยนเป็นลิงก์ /exec ล่าสุดเท่านั้น
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoCYuUfnPzlPDYLRrS6_nbWdUoiNglRP2J40M_cW3UHOMKKjqn6e_5Qt8vY4JSIVaf3w/exec";

        async function submitForm() {
            const nameInput = document.getElementById("fullName");
            const name = nameInput.value.trim();
            const btn = document.getElementById("submitBtn");
            const status = document.getElementById("statusMsg");

            if (!name) {
                status.textContent = "⚠️ กรุณากรอกชื่อให้ครบถ้วน";
                status.style.color = "#b45309";
                setTimeout(() => status.textContent = "", 2500);
                return;
            }

            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> กำลังบันทึก...';
            btn.disabled = true;
            status.textContent = "";

            try {
                const formData = new FormData();
                formData.append("name", name);

                const res = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: formData,
                    redirect: "follow"
                });

                const rawText = await res.text();
                console.log("ข้อมูลที่ได้จากระบบ:", rawText); // เช็คจริงในคอนโซล
                let result;

                try {
                    result = JSON.parse(rawText);
                } catch (e) {
                    throw new Error("ระบบไม่ส่งข้อมูลกลับ / ยังใช้โค้ดเก่า");
                }

                // ✅ ตรวจสอบสำเร็จแน่นอน + ล้างชื่อทันที
                if (result.success === true && typeof result.order === "number") {
                    status.textContent = `✅ สำเร็จ! คุณเป็นผู้ลงนามคนที่ ${result.order}`;
                    status.style.color = "#166534";
                    nameInput.value = ""; // ล้างชื่อแน่นอน
                    setTimeout(() => status.textContent = "", 4000);
                }
                // รองรับกรณีเก่าชั่วคราว (ถ้ายังส่ง status:ok)
                else if (result.status === "ok" && result.order) {
                    status.textContent = `✅ สำเร็จ! คุณเป็นผู้ลงนามคนที่ ${result.order}`;
                    status.style.color = "#166534";
                    nameInput.value = "";
                    setTimeout(() => status.textContent = "", 4000);
                }
                else {
                    status.textContent = "❌ ไม่สำเร็จ: " + (result.error || "รูปแบบข้อมูลไม่ถูกต้อง");
                    status.style.color = "#dc2626";
                    setTimeout(() => status.textContent = "", 3000);
                }

            } catch (err) {
                console.error("ผิดพลาด:", err);
                status.textContent = "❌ ไม่สำเร็จ: " + err.message;
                status.style.color = "#dc2626";
                setTimeout(() => status.textContent = "", 3000);
            }

            setTimeout(() => {
                btn.innerHTML = '<i class="fa fa-file-text-o mr-2"></i> ลงนามถวายพระพร';
                btn.disabled = false;
            }, 1500);
        }

        document.getElementById("submitBtn").addEventListener("click", submitForm);
        document.getElementById("fullName").addEventListener("keydown", e => {
            if (e.key === "Enter") { e.preventDefault(); submitForm(); }
        });
    </script>
</body>
</html>
