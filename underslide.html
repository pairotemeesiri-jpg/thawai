<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ถวายพระพรออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { bg:'#f9e89c', line:'#b8860b', btn:'#f2dd88', text:'#46370d' }
                    },
                    fontFamily: { sans: ['"Chakra Petch"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{background:#f9e89c;font-family:'Chakra Petch',sans-serif;color:#46370d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
        .wrap{width:100%;max-width:550px;display:flex;flex-direction:column;gap:1.5rem}
        .img-box{text-align:center}
        .royal-img{max-width:320px;width:100%;border-radius:8px;margin:0 auto;box-shadow:0 4px 12px rgba(184, 134, 11, 0.2)}
        .title{font-size:1.15rem;font-weight:600;line-height:1.8;margin-top:.75rem}
        .form{display:flex;flex-direction:column;gap:1.75rem;width:100%}
        .inp-group{display:flex;align-items:center;gap:.75rem;width:100%}
        .inp-group label{font-size:1.35rem;font-weight:500;white-space:nowrap}
        .inp-group input{flex:1;background:transparent;border:none;border-bottom:2px solid #b8860b;outline:none;font-size:1.35rem;color:#46370d;padding:.25rem .5rem;transition:border-color 0.2s ease}
        .inp-group input:focus{border-bottom-color:#8b6914;background-color:rgba(255,255,255,0.3)}
        .btn{background:linear-gradient(180deg,#f9eb9f,#e6c864 50%,#d4af37);border:2px solid #b8860b;border-radius:999px;padding:.9rem 2.25rem;font-size:1.25rem;font-weight:600;color:#46370d;cursor:pointer;clip-path:polygon(0 50%,8% 0,92% 0,100% 50%,92% 100%,8% 100%);transition:.2s ease}
        .btn:hover{transform:translateY(-2px);box-shadow:0 6px 15px rgba(184, 134, 11, 0.3)}
        .btn:active{transform:translateY(0)}
        .btn:disabled{opacity:0.7;cursor:not-allowed;transform:none;box-shadow:none}
        #msg{min-height:1.5rem;font-size:1.15rem;font-weight:600;text-align:center;transition:opacity 0.2s ease}
    </style>
</head>
<body>
<div class="wrap">
    <div class="img-box">
        <img src="Wachira.jpg" alt="พระบรมฉายาลักษณ์" class="royal-img">
        <p class="title">น้อมเกล้าถวายพระพรชัยมงคล<br>
        สมเด็จพระเจ้าอยู่หัวมหาวชิราลงกรณ บดินทรเทพยวรางกูร<br>
        มหิศรภูมิพลราชวรางกูร กิติสิริสมบูรณอดุลยเดช<br>
        สยามินทราธิเบศรราชวโรดม บรมนาถบพิตร<br>พระวชิรเกล้าเจ้าอยู่หัว</p>
    </div>
    <div class="form">
        <div class="inp-group">
            <label>ชื่อ – นามสกุล</label>
            <input type="text" id="fullName" autocomplete="name" placeholder="กรอกชื่อและนามสกุล" maxlength="100">
        </div>
        <button id="btnSend" class="btn"><i class="fa fa-file-text-o mr-2"></i> ลงนามถวายพระพร</button>
        <div id="msg"></div>
    </div>
</div>

<script>
// 📌 Web App URL
const URL = "https://script.google.com/macros/s/AKfycbyGJDW5lJxVRQV4uR0x5nG8JbGwLEAcx0rWtEnEajqkZj5AmmcOMzst1AilX6BvFwZKjQ/exec";

document.getElementById("btnSend").addEventListener("click", async () => {
    const nameInput = document.getElementById("fullName");
    const name = nameInput.value.trim();
    const btn = document.getElementById("btnSend");
    const msg = document.getElementById("msg");

    if(!name){ 
        msg.textContent = "⚠️ กรุณากรอกชื่อ-นามสกุล"; 
        msg.style.color = "#b45309"; 
        setTimeout(() => msg.textContent = "", 2500); 
        nameInput.focus(); 
        return; 
    }

    btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> กำลังบันทึก...';
    btn.disabled = true; 
    msg.textContent = "";

    try {
        const res = await fetch(URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "name=" + encodeURIComponent(name),
            redirect: "follow"
        });
        
        const txt = await res.text();
        console.log("📌 ตอบกลับจาก Apps Script:", txt);

        const data = JSON.parse(txt);

        if (data && data.success === true) {
            // ✅ แสดงลำดับที่และจำนวนรวมทั้งหมด
            msg.textContent = `✅ สำเร็จ! คุณเป็นคนที่ ${data.order} (รวมทั้งหมด ${data.total} คน)`;
            msg.style.color = "#166534";
            nameInput.value = "";
            setTimeout(() => msg.textContent = "", 5000);
        } else {
            // ❌ ไม่แสดงสาเหตุข้อผิดพลาด
            msg.textContent = "❌ ไม่สามารถบันทึกได้";
            msg.style.color = "#dc2626";
            setTimeout(() => msg.textContent = "", 5000);
        }
    } catch(e) {
        console.error("❌ ข้อผิดพลาด:", e);
        msg.textContent = "❌ ไม่สามารถบันทึกได้";
        msg.style.color = "#dc2626";
        setTimeout(() => msg.textContent = "", 5000);
    } finally {
        btn.innerHTML = '<i class="fa fa-file-text-o mr-2"></i> ลงนามถวายพระพร'; 
        btn.disabled = false;
    }
});

document.getElementById("fullName").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("btnSend").click();
});
</script>
</body>
</html>
